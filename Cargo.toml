[package]
name = "fast_clip"
version = "1.1.0"
edition = "2024"

[workspace]
members = [
    "crates/app_assets",
]

[workspace.lints]

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
gpui-kit = "0.7.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3"

[features]
default = []
static-ffmpeg = ["ffmpeg-next/static"]

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
futures.workspace = true

reqwest_client.workspace = true
app_assets = { path = "crates/app_assets" }
serde = { workspace = true }
serde_json.workspace = true
image = "0.25.10"
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
ringbuf = "0.4.8"
cpal = "0.17.3"
rust-i18n = "3.1.5"
path-absolutize = "3.1.1"
atomic_float = "1.1.0"
semver = "1.0.28"
strum = "0.28.0"
strum_macros = "0.28.0"

[build-dependencies]
winres = "0.1.12"

[profile.release-static]
inherits = "release"
codegen-units = 1
lto = "thin"
strip = "symbols"

[package.metadata.bundle]
name = "FastClip"
identifier = "com.him049.fastclip"
icon = ["assets/AppIcon.icns"]
resources = ["LICENSE"]
category = "Utility"
short_description = "A fast video clipping tool."
