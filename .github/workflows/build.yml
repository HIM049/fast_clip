name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64 static
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      VCPKGRS_TRIPLET: x64-windows-fastclip-static-md
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-static

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 74e6536215718009aae747d86d84b78376bf9e09
          path: vcpkg

      - name: Install FFmpeg
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe install ffmpeg:x64-windows-fastclip-static-md --overlay-ports="$env:GITHUB_WORKSPACE\vcpkg-overlay" --overlay-triplets="$env:GITHUB_WORKSPACE\vcpkg-triplets"
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Dynamic alternative retained for future use:
          # .\vcpkg\vcpkg.exe install ffmpeg:x64-windows --overlay-ports="$env:GITHUB_WORKSPACE\vcpkg-overlay"

      - name: Build release binary
        shell: pwsh
        run: |
          Remove-Item Env:FFMPEG_DIR -ErrorAction SilentlyContinue
          cargo build --profile release-static --features static-ffmpeg --locked

          # Dynamic alternative retained for future use:
          # cargo build --release --locked

      - name: Package Windows artifact
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -VcpkgRoot "$env:VCPKG_ROOT"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastClip-windows-x86_64-static
          path: dist/FastClip-windows-x86_64-static.zip
          retention-days: 15
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Restore Homebrew download cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-arm64-homebrew-ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install FFmpeg
        id: ffmpeg
        run: |
          brew install ffmpeg
          echo "prefix=$(brew --prefix ffmpeg)" >> "$GITHUB_OUTPUT"
          echo "version=$(brew info --json=v2 ffmpeg | jq -r '.formulae[0].installed[0].version')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-bundle-0.11.0-${{ hashFiles('Cargo.lock') }}-${{ steps.ffmpeg.outputs.version }}
          restore-keys: |
            macos-arm64-cargo-bundle-0.11.0-${{ hashFiles('Cargo.lock') }}-

      - name: Install cargo-bundle
        run: |
          if ! cargo bundle --version 2>/dev/null | grep -Fq "cargo-bundle v0.11.0"; then
            cargo install cargo-bundle --version 0.11.0 --locked --force
          fi

      - name: Build release binary
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.prefix }}
        run: cargo build --release --locked

      - name: Package native macOS DMG
        env:
          FFMPEG_PREFIX: ${{ steps.ffmpeg.outputs.prefix }}
        run: bash scripts/package-macos.sh target/release/fast_clip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastClip-macos-arm64-dynamic
          path: target/release/bundle/dmg/FastClip.dmg
          retention-days: 15
          if-no-files-found: error
